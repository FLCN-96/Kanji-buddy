<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>kanji-buddy · mastery</title>
<link rel="stylesheet" href="design_system/colors_and_type.css">
<link rel="stylesheet" href="home.css">
<link rel="stylesheet" href="mastery.css">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<meta name="theme-color" content="#00e5ff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="KB">
</head>
<body data-scanlines="off">
<div id="root"></div>

<script src="data/rank.js"></script>
<script src="data/version.js"></script>
<script src="data/db.js"></script>
<script src="data/load-cards.js"></script>
<script src="data/mastery.js"></script>

<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" integrity="sha384-DGyLxAyjq0f9SPpVevD6IgztCFlnMF6oW/XQGmfe+IsZ8TqEiDrcHkMLKI6fiB/Z" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" integrity="sha384-gTGxhz21lVGYNMcdJOyq01Edg0jhn/c22nsx0kyqP0TxaV5WVdsSH1fSDUf5YJj1" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="components/MasteryCore.jsx"></script>
<script type="text/babel" src="components/MasteryConstellation.jsx"></script>
<script type="text/babel" src="components/MasteryInstrument.jsx"></script>
<script type="text/babel" src="components/MasteryDossier.jsx"></script>
<script type="text/babel" src="components/Mastery.jsx"></script>

<script type="text/babel">
  // Mirror Diagnostics.html's defensive mount: blank-page silence is the
  // worst possible failure mode for a stats page, so surface load and
  // render exceptions inline with a terminal-style fallback. Same skeleton
  // as Diagnostics so the user can copy/paste the error verbatim.
  const mount = document.getElementById('root');
  const showFallback = (title, detail) => {
    mount.innerHTML =
      '<div class="kb-shell variant-game kb-mastery-shell">' +
        '<header class="kb-mastery-top">' +
          '<a href="Home.html" class="kb-mastery-back">◂ home</a>' +
          '<div class="kb-mastery-title">▸ MASTERY <span class="kb-mastery-title-meta">// load failure</span></div>' +
        '</header>' +
        '<main class="kb-mastery-main">' +
          '<section style="background:rgba(0,0,0,.32);border:1px solid var(--accent-magenta);padding:14px;margin-top:12px">' +
            '<div style="color:var(--accent-magenta);font-family:var(--font-mono);font-size:12px;letter-spacing:.14em;margin-bottom:8px">' +
              '▸ ' + title +
            '</div>' +
            '<pre style="white-space:pre-wrap;color:var(--fg-1);font:12px/1.5 var(--font-mono);margin:0">' +
              String(detail).replace(/[<>&]/g, c => ({'<':'&lt;','>':'&gt;','&':'&amp;'}[c])) +
            '</pre>' +
            '<div style="margin-top:14px;color:var(--fg-2);font-family:var(--font-mono);font-size:11px;letter-spacing:.1em">' +
              'hint · pull-to-refresh, or Settings → diagnostics for the full readout' +
            '</div>' +
          '</section>' +
        '</main>' +
      '</div>';
  };
  // Capture errors as early as possible so a parse/init error in one of the
  // jsx files (which Babel can fail asynchronously) surfaces visibly.
  window.addEventListener('error', (ev) => {
    if (mount.children.length === 0) {
      showFallback('uncaught error', (ev.error && ev.error.stack) || ev.message || String(ev));
    }
  });

  (async () => {
    try {
      if (typeof window.Mastery !== 'function') {
        throw new Error('window.Mastery component is not defined — one of the components/Mastery*.jsx files failed to load or parse. Most often a stale service worker. Try the version-update banner on Home, or hard-refresh.');
      }
      const cards = await window.loadCards();
      const root = ReactDOM.createRoot(mount);
      root.render(<Mastery cards={cards} />);
    } catch (e) {
      showFallback('mount failed', (e && e.stack) || (e && e.message) || String(e));
    }
  })();
</script>

<script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('./sw.js').catch(() => {});
  }
</script>
</body>
</html>
